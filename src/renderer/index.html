<!doctype html>
<!-- `class="dark"` is deliberate: the approved design is dark-first and the
     tokens in styles.css define dark as the base palette. -->
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The renderer loads nothing from the network and evaluates nothing it
         did not ship with. This is enforced again in the main process. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'"
    />
    <title>AI Orchestrator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
