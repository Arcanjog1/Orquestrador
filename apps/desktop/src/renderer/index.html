<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Orchestrator</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #12141a;
        --panel: #191c24;
        --panel-2: #212633;
        --line: #2b3040;
        --text: #e7e9ee;
        --muted: #98a0b3;
        --accent: #6ea8fe;
        --ok: #4ade80;
        --warn: #fbbf24;
        --bad: #f87171;
      }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      button {
        font: inherit;
        color: var(--text);
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: .5; cursor: default; }
      button.primary { background: var(--accent); color: #10131a; border-color: var(--accent); font-weight: 600; }
      input, select, textarea {
        font: inherit; color: var(--text); background: var(--panel-2);
        border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px;
      }
      .muted { color: var(--muted); }
      .row { display: flex; gap: 8px; align-items: center; }
      .col { display: flex; flex-direction: column; gap: 8px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
      .row > * { min-width: 0; }
      .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
      .dot.ok { background: var(--ok); }
      .dot.warn { background: var(--warn); }
      .dot.bad { background: var(--bad); }
      .dot.busy { background: var(--accent); }
      code, pre { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./renderer.js"></script>
  </body>
</html>
