<!doctype html>
<!-- `class="dark"` is deliberate: the approved design is dark-first and the
     tokens in styles.css define dark as the base palette. -->
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Orchestrator</title>
    <!-- Compiled from src/renderer/styles.css at build time. Served from the
         app itself, which is all `style-src 'self'` allows. -->
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="./renderer.js"></script>
  </body>
</html>
