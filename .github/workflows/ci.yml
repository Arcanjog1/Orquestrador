name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The build that matters: the product ships as a Windows desktop application,
  # so Windows is the platform whose failures are real failures.
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The Electron binary is ~160 MB and its postinstall has no timeout of its
      # own, so a slow download shows up as `npm ci` hanging with nothing in the
      # log to explain it. Fetching it in a step of its own gives it a visible
      # name and a bound, and lets the cache skip the download on later runs.
      - name: Install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Cache the Electron download
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-windows-${{ hashFiles('apps/desktop/package.json') }}

      - name: Ensure the Electron binary is present
        timeout-minutes: 10
        run: node node_modules/electron/install.js

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build the desktop application
        run: npm run desktop:build

      # Bounded at the step level as well as inside the suite: whatever hangs,
      # the job fails within minutes with a log, instead of burning its whole
      # allowance in silence.
      - name: Electron integration tests
        timeout-minutes: 15
        run: npm run -w apps/desktop test:electron

      - name: Package (NSIS, per-user, no elevation)
        timeout-minutes: 20
        run: npm run -w apps/desktop package

      - name: Packaged smoke test
        timeout-minutes: 15
        run: npm run -w apps/desktop test:packaged

      # The proof that the application can prepare Codex on a user's machine:
      # a real resolve, a real download, a real SHA-256 check, a real extract
      # and a real `codex --version`. This is the step that answers "No Codex
      # source produced a working binary", so it is required, not advisory.
      - name: Prove the Codex runtime installs for real
        timeout-minutes: 25
        # `--compare-sources` also installs from the npm registry and compares
        # the two codex.exe by SHA-256: the fact behind "a second source cannot
        # fix a local execution failure".
        run: node scripts/probe-real-runtimes.mjs --runtime codex --adapters --compare-sources

      # Read Anthropic's real installer before trying to use it, so the
      # resolver is written against what it does rather than a guess. Purely
      # informational: it installs nothing and cannot fail the build.
      - name: Discover the Claude install contract
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/discover-claude-source.mjs

      # Claude is now proved, not probed. Nothing here needs an account: the
      # claim is that the application can install Claude Code, find the
      # executable, and drive it - `--version` and `auth status --json`. An
      # unauthenticated answer is a correct answer; a failure to invoke is not.
      - name: Prove the Claude runtime installs for real
        timeout-minutes: 20
        run: node scripts/probe-real-runtimes.mjs --runtime claude-code --adapters

      # Git stays informational until a managed MinGit install has been seen
      # once; its tested version is still a guess and should not gate a build.
      - name: Probe the Git runtime
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/probe-real-runtimes.mjs --runtime git

      # Everything below is informational: it records what the real Windows
      # world actually answers, which is how the open questions about runtime
      # sources, MinGit and Authenticode publishers get settled. A failure here
      # must not fail the build - the point is to collect facts, not to assert
      # them before we know them.
      - name: Record the real Windows environment
        continue-on-error: true
        shell: pwsh
        run: |
          "## Windows facts" | Out-File -FilePath windows-facts.md -Encoding utf8
          "- OS: $([System.Environment]::OSVersion.VersionString)" | Add-Content windows-facts.md
          "- node: $(node --version)" | Add-Content windows-facts.md
          "- git: $(git --version)" | Add-Content windows-facts.md
          $exe = Get-ChildItem -Recurse -Filter 'AI Orchestrator.exe' apps/desktop/release | Select-Object -First 1
          if ($exe) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            "- packaged exe: $($exe.FullName)" | Add-Content windows-facts.md
            "- signature status: $($sig.Status)" | Add-Content windows-facts.md
            "- observed publisher: $($sig.SignerCertificate.Subject)" | Add-Content windows-facts.md
          }
          Get-Content windows-facts.md

      - name: Probe the real runtime sources
        continue-on-error: true
        run: node spike/windows-spike.mjs --non-interactive

      # Whether the installer was built and whether it could be uploaded are
      # two different questions. The first is this build's business and fails
      # the job; the second depends on the account's artifact storage quota,
      # which a green build has no business being red about.
      - name: Check the installer was produced
        shell: pwsh
        run: |
          $exe = 'apps/desktop/release/AI-Orchestrator-Setup.exe'
          if (-not (Test-Path $exe)) { throw "no installer at $exe" }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          "Installer built: $exe ($size MB)" | Tee-Object -FilePath installer.txt

      - name: Upload the installer
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: AI-Orchestrator-Setup
          path: apps/desktop/release/AI-Orchestrator-Setup.exe
          if-no-files-found: error

      - name: Upload the Windows facts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-facts
          path: |
            windows-facts.md
            spike/spike-report.txt
          if-no-files-found: ignore

      # Actions artifacts depend on a storage quota that a green build has no
      # control over. A pre-release does not, so the installer is always
      # downloadable from one place. The repository is private, so this is
      # visible only to people who already have access; it is marked
      # pre-release and uses a rolling tag, so it is never mistaken for a
      # stable release.
      # These branches publish under their own per-commit tag instead of the
      # rolling one above, so the build being offered is never in doubt and an
      # older `desktop-dev` release keeps pointing at the commit that produced
      # it. The file comes straight from the job that built it: no artifact
      # upload and download in between, because that store is what is out of
      # quota. No `continue-on-error` here on purpose - if the installer cannot
      # be published there is nothing to download, and that should be visible.
      #
      # The list is explicit rather than a `claude/` prefix: every agent branch
      # publishing a build would bury the ones anybody actually asked for.
      - name: Name this build
        if: contains(fromJSON('["claude/lovable-on-latest-core","claude/ai-orchestrator-implementation-y7xw98","claude/ai-orchestrator-reorientacao-ytlkw0","claude/ai-orchestrator-buzz-arch-vblrau"]'), github.ref_name)
        id: build
        shell: pwsh
        run: |
          $short = "${{ github.sha }}".Substring(0, 7)
          "tag=desktop-dev-$short" >> $env:GITHUB_OUTPUT
          "short=$short" >> $env:GITHUB_OUTPUT

      - name: Publish this build as a pre-release
        if: contains(fromJSON('["claude/lovable-on-latest-core","claude/ai-orchestrator-implementation-y7xw98","claude/ai-orchestrator-reorientacao-ytlkw0","claude/ai-orchestrator-buzz-arch-vblrau"]'), github.ref_name)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          # Without this the tag is created against the repository's default
          # branch, which is not this one: the asset would be the right build
          # under a tag pointing at somebody else's commit.
          target_commitish: ${{ github.sha }}
          name: AI Orchestrator - build de desenvolvimento (${{ steps.build.outputs.short }})
          prerelease: true
          draft: false
          fail_on_unmatched_files: true
          files: apps/desktop/release/AI-Orchestrator-Setup.exe
          body: |
            Build de desenvolvimento, para validacao do MVP com os provedores
            reais. Nao e uma versao estavel e nao esta assinado, entao o Windows
            mostra o aviso do SmartScreen.

            Repositorio: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Build: Windows x64 (NSIS, por usuario, sem elevacao)
            Arquivo: AI-Orchestrator-Setup.exe
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Publish the installer as a pre-release
        if: github.ref_name == 'claude/ai-orchestrator-continuation-grblen'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-dev
          name: AI Orchestrator - build de teste
          prerelease: true
          draft: false
          fail_on_unmatched_files: true
          files: apps/desktop/release/AI-Orchestrator-Setup.exe
          body: |
            Build de teste automático do branch de desenvolvimento.

            Não é uma versão estável. Sem assinatura de código, então o Windows
            vai mostrar o aviso do SmartScreen.

            Commit: ${{ github.sha }}

  # Linux is not a target platform. It runs because it is fast, and because a
  # break here is usually a break everywhere.
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Cache the Electron download
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-linux-${{ hashFiles('apps/desktop/package.json') }}

      - name: Ensure the Electron binary is present
        timeout-minutes: 10
        run: node node_modules/electron/install.js

      - name: Install xvfb
        run: |
          # Hosted runners may already have the complete display helper.
          # Avoid refreshing unrelated package feeds when it is usable.
          if ! command -v xvfb-run >/dev/null || ! command -v Xvfb >/dev/null || ! command -v xauth >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          xvfb-run -a true

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build the desktop application
        run: npm run desktop:build

      - name: Electron integration tests
        timeout-minutes: 15
        run: npm run -w apps/desktop test:electron

      - name: Prove the Codex runtime installs for real
        timeout-minutes: 20
        run: node scripts/probe-real-runtimes.mjs --runtime codex

      - name: Package (unpacked) and smoke-test it
        timeout-minutes: 20
        run: |
          npm run -w apps/desktop package:linux
          npm run -w apps/desktop test:packaged
